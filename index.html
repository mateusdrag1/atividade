<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>POSTECH - FULLSTACK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="flex_main">
      <div class="wrapper-hero">
        <header class="hero">
          <h1 class="hero__title">POSTECH - FULLSTACK</h1>
          <p class="hero__subtitle">Desafio aula inaugural</p>
        </header>
      </div>

      <main class="container">
        <section class="card">
          <div class="card__body">
            <h2 class="card__title">Informações do grupo</h2>

            <hr class="divider" />

            <form class="form" action="#" method="post">
              <div>
                <label class="label" for="n1">Nome</label>
                <input class="input" id="n1" type="text" name="nome1" />
              </div>

              <div>
                <label class="label" for="n2">Nome</label>
                <input class="input" id="n2" type="text" name="nome2" />
              </div>

              <div>
                <label class="label" for="n3">Nome</label>
                <input class="input" id="n3" type="text" name="nome3" />
              </div>

              <div>
                <label class="label" for="n4">Nome</label>
                <input class="input" id="n4" type="text" name="nome4" />
              </div>

              <div>
                <label class="label" for="n5">Nome</label>
                <input class="input" id="n5" type="text" name="nome5" />
              </div>

              <div>
                <label class="label" for="hist">História do grupo</label>
                <textarea
                  class="textarea"
                  id="hist"
                  name="historia"
                  rows="4"
                ></textarea>
              </div>
            </form>
          </div>

          <div class="card__footer">
            <button class="btn" type="submit" form="__noop">Enviar</button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
